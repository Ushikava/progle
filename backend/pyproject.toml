[project]
name = "progle"
version = "0.1.0"
description = "Progle project"
readme = "README.md"
authors = [
    { name = "Ushikava", email = "*****@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.32.0",
    "dotenv>=0.9.9",
    "fastapi[standard]>=0.147.0",
    "psycopg>=3.3.6",
    "pyjwt>=2.15.1",
    "sqlalchemy[asyncio]>=2.1.5",
    "sqlmodel>=0.0.48",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100

[tool.ruff.lint.isort]
known-first-party = ["core", "db", "models", "repositories", "routers", "services"]
